[project]
name = "loculus-eternal"
version = "0.0.1"
description = "Permanent, verifiable backup of Pathoplexus (Loculus) released data in Ethereum blobs"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "ckzg>=2",
    "web3>=7",
    "eth-account>=0.13",
    "zstandard>=0.23",
    "rfc8785>=0.1",
    "httpx>=0.27",
]

[project.scripts]
loculus-eternal = "loculus_eternal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loculus_eternal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests spread over every core; a file whose tests share one chain or one Kubo node is kept
# on one worker by its xdist_group mark. `-m "not slow"` is the quick tier: no anvil, no Docker.
addopts = "-n auto --dist loadgroup"
markers = [
    "slow: needs anvil or a Kubo container; left out of the quick tier",
]
