[project]
name = "loculus-eternal"
version = "0.0.1"
description = "Permanent, verifiable backup of Pathoplexus (Loculus) released data in Ethereum blobs"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "ckzg>=2",
    "web3>=7",
    "eth-account>=0.13",
    "zstandard>=0.23",
    "rfc8785>=0.1",
    "httpx>=0.27",
]

[project.scripts]
loculus-eternal = "loculus_eternal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loculus_eternal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
