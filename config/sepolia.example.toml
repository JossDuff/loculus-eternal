# Example Loculus Eternal configuration for Sepolia test network. Copy to loculus-eternal.toml in the
# repository checkout (tooling_paths and spec_path are relative to this file) and fill in the
# four marked lines. The publisher private key is never in this file: export LOCULUS_ETERNAL_PUBLISHER_PRIVATE_KEY.

[chain]
rpc_url = "https://sepolia.infura.io/v3/${RPC_API}"     # ${NAME} is read from the environment, so no key lives in this file
contract = "0x0000000000000000000000000000000000000000" # CHANGE: after deployment
chain_id = 11155111
max_requests_per_second = 5                             # Infura's free tier meters requests; spaced and retried
deployment_block = 0                                    # CHANGE: the block the contract was deployed in

[backend]
url = "https://backend.pathoplexus.org"
organisms = "all"                       # every organism the backend serves, asked each run; or a list of names

[upload]
data_dir = "upload-data"
tooling_paths = [
    "spec/container-spec.md",
    "spec/contract.md",
    "spec/ipfs-profile.md",
    "src/loculus_eternal/**/*.py",
    "pyproject.toml",
    "uv.lock",
]
max_blob_fee_gwei = 50 # Sepolia blob fees are noisy; the campaign measures them
max_priority_fee_gwei = 1
inclusion_timeout_blocks = 6
escalation_attempts = 8
max_in_flight = 8 # transactions sent before the first is included
max_blobs_per_transaction = 6 # the protocol's cap since Fusaka; re-check at each fork
finality_timeout_seconds = 1800

[ipfs]
endpoints = ["http://127.0.0.1:5001"] # CHANGE: the team Kubo nodes
spec_path = "spec/container-spec.md"
required = false

[recover]
data_dir = "recovery-data"
out_dir = "recovered"
manifest_sources = ["logs"]

# Sources are tried in order for reading the published stream back. Every byte is verified,
# so order is about speed and cost, not trust. The more independent operators, the better:
# the data is lost only if every one of them loses the same bytes. Surveyed 2026-10-13.
[[sources]]
type = "beacon"
endpoints = [
    "https://ethereum-sepolia-beacon-api.publicnode.com",
] # a plain beacon node: the last 18 days only

[[sources]]
type = "beacon"
endpoints = [
    "https://sepolia.blobs.pinax.network",
] # Pinax: beacon-shaped archive, history back to at least mid-2026

[[sources]]
type = "blockscout"
url = "https://eth-sepolia.blockscout.com" # archive since Dencun; a blob's bytes appear a week or two after inclusion

[[sources]]
type = "blobscan"
url = "https://api.sepolia.blobscan.com" # Blobscan no longer guarantees Sepolia blobs; still asked

[[sources]]
type = "ipfs"
endpoints = [
    "http://127.0.0.1:5001",
] # reads the snapshot the contract names; no CID is ever configured
